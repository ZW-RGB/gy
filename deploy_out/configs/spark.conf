# ============== Spark 单节点集群配置 ==============
# 使用方式：spark-submit --properties-file spark.conf ...
# 或者：spark-submit --conf key=value ...

# ==== 数据源 ====
# HDFS 基础路径（DailyStatsJob、ModelTrainingJob 都会读取）
spark.predictive.hdfs.data.base=hdfs://master:9000/data/history/sensor
spark.predictive.hdfs.model.base=hdfs://master:9000/models

# ==== MySQL ====
spark.predictive.mysql.url=jdbc:mysql://master:3306/predictive_maintenance?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf-8
spark.predictive.mysql.user=root
spark.predictive.mysql.password=060201

# ==== 执行器 ====
spark.executor.memory=2g
spark.executor.cores=2
spark.dynamicAllocation.enabled=true
spark.dynamicAllocation.maxExecutors=4
spark.dynamicAllocation.minExecutors=1

# ==== 性能 ====
spark.sql.adaptive.enabled=true
spark.sql.adaptive.coalescePartitions.enabled=true
spark.sql.files.ignoreMissingFiles=true
spark.sql.files.ignoreCorruptFiles=true
