# ============== Flink 单节点集群配置（仅 master） ==============
# 部署到 YARN 时通过 -Dconfig.file=/opt/flink/config/cluster.properties 指定

kafka.bootstrap.servers=master:9092
kafka.topic=device-sensor
kafka.group.id=flink-device-group

mysql.url=jdbc:mysql://master:3306/predictive_maintenance?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
mysql.user=root
mysql.password=060201

redis.host=master
redis.port=6379
redis.password=123456

hdfs.uri=hdfs://master:9000
hdfs.model.index.path=/models/anomaly_current_version.txt
hdfs.checkpoint.path=/flink/checkpoints/
hdfs.sensor.output.path=hdfs://master:9000/data/history/sensor

window.size.ms=30000
window.slide.ms=10000
alarm.threshold=0.8
model.reload.interval.ms=60000

cep.temp.rise.threshold=2.0
cep.temp.rise.count=3
cep.vibration.threshold=5.0
cep.current.threshold=3.5
cep.pressure.drop.threshold=10.0
