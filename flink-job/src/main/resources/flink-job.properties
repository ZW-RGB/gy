# ============== Flink 作业默认配置（开发环境） ==============
# 生产/集群部署时请用 -Dconfig.file 覆盖此文件

# Kafka
kafka.bootstrap.servers=localhost:9092
kafka.topic=device-sensor
kafka.group.id=flink-device-group

# MySQL
mysql.url=jdbc:mysql://localhost:3306/predictive_maintenance?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
mysql.user=root
mysql.password=

# Redis
redis.host=localhost
redis.port=6379
redis.password=

# HDFS
hdfs.uri=hdfs://localhost:9000
hdfs.model.index.path=/tmp/models/anomaly_current_version.txt
hdfs.checkpoint.path=/flink/checkpoints/
hdfs.sensor.output.path=hdfs://localhost:9000/data/history/sensor

# 窗口 / 阈值
window.size.ms=30000
window.slide.ms=10000
alarm.threshold=0.8
model.reload.interval.ms=60000

cep.temp.rise.threshold=2.0
cep.temp.rise.count=3
cep.vibration.threshold=5.0
cep.current.threshold=3.5
cep.pressure.drop.threshold=10.0
